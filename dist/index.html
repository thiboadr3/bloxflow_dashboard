<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fafaf9"><title>Bloxflow · Prospecten beoordelen</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafaf9;color:#242722;font:14px/1.4 'Helvetica Neue',Helvetica,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #71977e;outline-offset:3px}.app{height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:#fff}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #e6e8e3;gap:12px}.brand{font-weight:650;font-size:17px;letter-spacing:-.6px}.demo{font-size:11px;color:#70756b;margin-left:8px}.count{font-variant-numeric:tabular-nums;color:#666b61}.sectorbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 18px;border-bottom:1px solid #e6e8e3}.sectorbar label{font-size:12px;color:#626b5c}.sectorbar select{flex:1;min-width:140px;max-width:100%;min-height:44px;background:white;color:#242722;border:1px solid #dce0d8;border-radius:6px;padding:8px;font:inherit}.sectorbar span{font-size:11px;color:#626b5c}.identity{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;gap:12px}.identity strong{display:block;font-weight:600;font-size:16px}.identity small{display:block;color:#74796f;margin-top:2px}.open{color:#343f35;text-decoration:none;border:1px solid #dce0d8;border-radius:6px;padding:8px 10px;white-space:nowrap;font-size:12px}.preview{position:relative;flex:1;min-height:100px;background:#f4f5f1;overflow:hidden}.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.fallback{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px}.fallback div{max-width:310px}.fallback h2{font-size:21px;font-weight:550;margin:0 0 10px;letter-spacing:-.5px}.fallback p{color:#6b7065}.fallback a{display:inline-block;margin-top:10px;background:#273d2e;color:white;text-decoration:none;padding:12px 18px;border-radius:7px}.toolbar{padding:8px 18px 10px;border-bottom:1px solid #e6e8e3;display:flex;justify-content:space-between;gap:8px}.textbutton{border:0;background:none;color:#697061;font:inherit;font-size:12px;padding:3px 0;text-decoration:underline;text-underline-offset:3px}.bottom{padding:10px 18px max(14px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e6e8e3}.swipe{touch-action:pan-y;user-select:none;padding:12px 0 16px;text-align:center;color:#73786f;font-size:12px;cursor:grab}.swipe strong{font-weight:500;color:#3c493c}.actions{display:grid;grid-template-columns:1fr 45px 1fr;gap:12px;align-items:center}.action{height:48px;border-radius:8px;font-weight:550;background:#fff;border:1px solid #dce0d8;color:#535a4d;display:flex;justify-content:center;align-items:center;gap:8px}.action.yes{background:#263f30;border-color:#263f30;color:#fff}.undo{border:0;background:transparent;color:#6a7164;height:44px;border-radius:6px;font-size:23px}.undo:disabled{opacity:.3}.meta{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:11px;color:#777e70}.hint{padding:8px 18px;background:#eff3ec;color:#45533d;font-size:12px;text-align:center}.complete{flex:1;overflow:auto;padding:28px 22px}.complete h1{font-size:24px;letter-spacing:-.7px;font-weight:550}.result{padding:14px 0;border-bottom:1px solid #e5e8e1;display:flex;justify-content:space-between;gap:12px}.result span{color:#687260}.restart{margin-top:24px;padding:12px 18px;background:#263f30;color:#fff;border:0;border-radius:7px;font:inherit}.hidden{display:none!important}.signal{position:absolute;z-index:5;inset:0;pointer-events:none;display:flex;justify-content:center;align-items:center;opacity:0;background:#e9f3e8d9;font-size:26px;font-weight:600;color:#263f30}.signal.no{background:#f5eee9d9;color:#734d38}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}@media(min-width:700px){body{background:#eeefe9}.app{max-width:780px;border-left:1px solid #dfe2d8;border-right:1px solid #dfe2d8}.bottom{padding-left:100px;padding-right:100px}}@media(prefers-reduced-motion:no-preference){.signal{transition:opacity .12s}}
</style></head><body><div class="app"><header class="top"><div><span class="brand">bloxflow</span><a class="demo" href="dashboard.html" style="text-decoration:none;margin-left:12px">Dashboard ↗</a><a class="demo" href="werkruimte.html" style="margin-left:12px">Werkruimte ↗</a></div><span class="count" id="count"></span></header><section class="sectorbar"><label for="sector">Sector</label><select id="sector" aria-label="Sector kiezen"></select><span id="remaining" aria-live="polite"></span></section><div id="review" style="display:contents"><section class="identity"><div><strong id="name"></strong><small id="domain"></small></div><a class="open" id="open" target="_blank" rel="noopener noreferrer">Open website ↗</a></section><div class="toolbar"><span style="font-size:12px;color:#72796b">Echte website</span><button class="textbutton" id="trouble">Website niet zichtbaar?</button></div><div class="preview" id="preview"><iframe id="frame" title="Website van de prospect" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe><div class="fallback hidden" id="fallback"><div><h2 id="fallback-title">Bekijk de website rechtstreeks</h2><p id="fallback-text">Open de website en keer daarna terug naar dit scherm om je keuze te maken.</p><a id="fallback-link" target="_blank" rel="noopener noreferrer">Website bekijken ↗</a></div></div><div class="signal" id="signal"></div></div><footer class="bottom"><div class="swipe" id="swipe" aria-label="Veeg hier naar links om af te wijzen of naar rechts om goed te keuren">← Afwijzen <strong>· Veeg hier ·</strong> Goedkeuren →</div><div class="actions"><button class="action" id="no"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Afwijzen</button><button class="undo" id="undo" aria-label="Vorige keuze ongedaan maken">↶</button><button class="action yes" id="yes"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></svg>Goedkeuren</button></div><div class="meta"><span id="totals"></span><span>Alleen op dit toestel</span></div></footer></div><section class="complete hidden" id="complete"></section><div class="hint" id="notice" role="status" aria-live="polite">Testselectie · geen mails of databasewijzigingen</div></div>
<script>
const companies=[{sector:'hvac',name:'Beproactive',url:'https://beproactive.be/'},{sector:'hvac',name:'BT Works',url:'https://www.bt-works.be/'},{sector:'unassigned',name:'Baeck',url:'https://baeck.be/nl-be',blocked:true},{sector:'unassigned',name:'Baert Gebroeders',url:'https://www.baertge.be'}];
const $=id=>document.getElementById(id);const sectors=[['all','Alle sectoren'],['hvac','HVAC'],['dak','Dak & gevel'],['tuin','Tuinaanleg'],['schrijn','Schrijnwerk'],['renov','Renovatie'],['metaal','Metaalwerk'],['solar','Solar'],['kliniek','Esthetische kliniek'],['tandarts','Esthetische tandarts'],['salon','Schoonheidssalons'],['unassigned','Nog in te delen']];let history=[];let sector='all';try{const saved=JSON.parse(localStorage.getItem('bloxflow-swipe-v2')||localStorage.getItem('bloxflow-swipe-v1')||'[]');if(Array.isArray(saved))history=saved.filter((x,i,a)=>companies.some(c=>c.url===x.url)&&['yes','no'].includes(x.choice)&&a.findIndex(y=>y.url===x.url)===i);const requested=new URLSearchParams(location.search).get('sector')||localStorage.getItem('bloxflow-sector');if(sectors.some(s=>s[0]===requested))sector=requested}catch{}let busy=false,start=null;
function filtered(){return companies.filter(c=>sector==='all'||c.sector===sector)}function current(){return filtered().find(c=>!history.some(h=>h.url===c.url))}
function persist(){try{localStorage.setItem('bloxflow-swipe-v2',JSON.stringify(history));localStorage.setItem('bloxflow-sector',sector)}catch{$('notice').textContent='Opslaan op dit toestel is niet beschikbaar; keuzes blijven in deze sessie.'}}
function choices(){sectors.forEach(([id,label])=>{const count=companies.filter(c=>(id==='all'||c.sector===id)&&!history.some(h=>h.url===c.url)).length;let option=$('sector').querySelector('option[value="'+id+'"]');if(!option){option=document.createElement('option');option.value=id;$('sector').append(option)}option.textContent=label+' · '+count+' open'});$('sector').value=sector}
function fallback(blocked){$('frame').classList.add('hidden');$('fallback').classList.remove('hidden');$('fallback-title').textContent=blocked?'Deze website opent apart':'Website niet zichtbaar?';$('fallback-text').textContent=blocked?'Baeck blokkeert weergave binnen andere toepassingen. Open de echte website en keer terug om te beoordelen.':'Sommige websites laten zich niet binnen een ander scherm bekijken. Open de website en keer terug om te beoordelen.'}
function render(){choices();const list=filtered(),pending=list.filter(c=>!history.some(h=>h.url===c.url)),c=pending[0],done=!c;$('review').classList.toggle('hidden',done);$('complete').classList.toggle('hidden',!done);$('remaining').textContent=pending.length+' nog open';$('count').textContent=(list.length-pending.length)+' / '+list.length+' bekeken';$('undo').disabled=!history.length;$('totals').textContent=history.filter(h=>list.some(c=>c.url===h.url)&&h.choice==='yes').length+' goedgekeurd · '+history.filter(h=>list.some(c=>c.url===h.url)&&h.choice==='no').length+' afgewezen';if(done){$('frame').src='about:blank';$('complete').replaceChildren();const title=document.createElement('h1');title.textContent=list.length?'Deze sector is bekeken.':'Geen voorbeeldbedrijven in deze sector.';const note=document.createElement('p');note.textContent=list.length?'Je keuzes blijven bewaard. Kies bovenaan een andere sector.':'De demo bevat vier aangeleverde websites. Echte prospecten volgen na de beveiligde databasekoppeling.';$('complete').append(title,note);history.filter(h=>list.some(c=>c.url===h.url)).forEach(h=>{const row=document.createElement('div');row.className='result';const name=document.createElement('strong');name.textContent=companies.find(c=>c.url===h.url).name;const state=document.createElement('span');state.textContent=h.choice==='yes'?'Goedgekeurd':'Afgewezen';row.append(name,state);$('complete').append(row)});if(list.length){const reset=document.createElement('button');reset.className='restart';reset.textContent='Deze sector opnieuw beoordelen';reset.onclick=()=>{history=history.filter(h=>!list.some(c=>c.url===h.url));persist();render()};$('complete').append(reset)}if(history.length){const back=document.createElement('button');back.className='textbutton';back.style.display='block';back.style.marginTop='18px';back.textContent='Laatste keuze ongedaan maken';back.onclick=undo;$('complete').append(back)}return}$('name').textContent=c.name;$('domain').textContent=new URL(c.url).hostname+' · '+sectors.find(s=>s[0]===c.sector)[1];$('open').href=c.url;$('fallback-link').href=c.url;$('fallback').classList.add('hidden');$('frame').classList.remove('hidden');if(c.blocked){$('frame').src='about:blank';fallback(true)}else $('frame').src=c.url}
function decide(choice){const c=current();if(busy||!c)return;busy=true;$('sector').disabled=true;const signal=$('signal');signal.textContent=choice==='yes'?'Goedgekeurd':'Afgewezen';signal.classList.toggle('no',choice==='no');signal.style.opacity='1';setTimeout(()=>{history.push({url:c.url,choice,at:new Date().toISOString()});persist();signal.style.opacity='0';busy=false;$('sector').disabled=false;render()},160)}function undo(){if(busy||!history.length)return;const removed=history.pop();const c=companies.find(c=>c.url===removed.url);if(sector!=='all'&&sector!==c.sector)sector=c.sector;persist();render()}
$('sector').onchange=()=>{sector=$('sector').value;persist();render()};
$('yes').onclick=()=>decide('yes');$('no').onclick=()=>decide('no');$('undo').onclick=undo;$('trouble').onclick=()=>fallback(false);$('swipe').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};$('swipe').setPointerCapture(e.pointerId)});$('swipe').addEventListener('pointerup',e=>{if(start){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4)decide(dx>0?'yes':'no')}start=null});$('swipe').addEventListener('pointercancel',()=>start=null);document.addEventListener('keydown',e=>{if(e.target.closest('button,a,input,textarea,select'))return;if(e.key==='ArrowRight')decide('yes');if(e.key==='ArrowLeft')decide('no')});render();
</script></body></html>

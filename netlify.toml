[build]
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/werkruimte"
  status = 302

[[redirects]]
  from = "/werkruimte"
  to = "/werkruimte.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/werkruimte*"
  [headers.values]
    Cache-Control = "no-store"
